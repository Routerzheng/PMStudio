<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>H5 原型设计与动图截图实验室</title>
    
    <!-- 优先读取本地 JS，若无本地文件则自动连接国内高速可用节点 -->
    <script src="./js/html2canvas.min.js"></script>
    <script>window.html2canvas || document.write('<script src="https://cdn.bootcdn.net/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"><\/script>')</script>

    <script src="./js/fabric.min.js"></script>
    <script>window.fabric || document.write('<script src="https://cdn.bootcdn.net/ajax/libs/fabric.js/5.3.0/fabric.min.js"><\/script>')</script>

    <script src="./js/gifshot.min.js"></script>
    <script>window.gifshot || document.write('<script src="https://testingcf.jsdelivr.net/npm/gifshot@0.4.5/dist/gifshot.min.js"><\/script>')</script>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            height: 100vh; 
            display: flex; 
            flex-direction: column; 
            background: #181825; 
            color: #cdd6f4; 
            overflow: hidden; 

            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            text-rendering: optimizeLegibility;
        }
        
        header { background: #1e1e2e; padding: 10px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #313244; z-index: 10; }
        .logo { font-size: 15px; font-weight: bold; color: #a6e3a1; display: flex; align-items: center; gap: 8px; }
        .btn-group { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
        
        button, select { background: #313244; border: 1px solid #45475a; color: #cdd6f4; padding: 6px 14px; border-radius: 6px; cursor: pointer; font-weight: 500; font-size: 13px; transition: all 0.2s; display: flex; align-items: center; gap: 5px; outline: none; }
        button:hover:not(:disabled) { background: #45475a; color: #fff; transform: translateY(-1px); }
        button:disabled { opacity: 0.5; cursor: not-allowed; transform: none !important; }
        select { cursor: pointer; }
        
        button.primary { background: #3b82f6; color: #ffffff; border: none; font-weight: 600; }
        button.primary:hover:not(:disabled) { background: #2563eb; }
        button.purple { background: #8b5cf6; color: #ffffff; border: none; font-weight: 600; }
        button.purple:hover:not(:disabled) { background: #7c3aed; }
        button.success { background: #10b981; color: #ffffff; border: none; font-weight: 600; }
        button.success:hover:not(:disabled) { background: #059669; }
        button.danger { background: #ef4444; color: #ffffff; border: none; font-weight: 600; }
        button.danger:hover:not(:disabled) { background: #dc2626; }
        
        .container { flex: 1; display: flex; overflow: hidden; position: relative; }
        .editor-area { width: 320px; min-width: 200px; max-width: 70vw; display: flex; flex-direction: column; background: #181825; }
        .preview-area { flex: 1; min-width: 300px; display: flex; flex-direction: column; background: #11111b; position: relative; transition: all 0.1s ease; overflow: hidden; }
        
        /* 通用分隔拖拽条样式 */
        .resizer {
            width: 6px;
            background: #313244;
            cursor: col-resize;
            user-select: none;
            z-index: 20;
            transition: background-color 0.2s;
        }
        .resizer:hover, .resizer.dragging {
            background: #89b4fa;
        }

        .ai-area { width: 450px; min-width: 320px; max-width: 80vw; display: none; flex-direction: column; background: #1e1e2e; transition: none; }
        .ai-area.active { display: flex; }
        .ai-iframe-container { flex: 1; position: relative; background: #11111b; overflow: hidden; }
        .ai-iframe-container iframe, .ai-iframe-container webview { width: 100%; height: 100%; border: none; }

        .no-pointer-events { pointer-events: none !important; }

        .preview-area.app-fullscreen { position: fixed !important; top: 0; left: 0; width: 100vw !important; height: 100vh !important; z-index: 990; }

        .area-title { background: #181825; color: #a6adc8; padding: 8px 16px; font-size: 12px; font-weight: bold; text-transform: uppercase; letter-spacing: 0.5px; border-bottom: 1px solid #313244; display: flex; justify-content: space-between; align-items: center; }
        textarea { flex: 1; border: none; padding: 16px; font-family: "Fira Code", Consolas, Monaco, monospace; font-size: 13px; background: #1e1e2e; color: #cdd6f4; resize: none; outline: none; line-height: 1.6; }
        
        .iframe-wrapper { flex: 1; position: relative; background: #181825; display: flex; justify-content: center; align-items: center; overflow: auto; padding: 20px; }
        
        .iframe-wrapper.mobile-mode iframe {
            width: 375px;
            height: 667px;
            border-radius: 24px;
            border: 8px solid #313244;
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
        }
        
        .iframe-wrapper.desktop-mode iframe {
            width: 100%;
            height: 100%;
            border-radius: 0;
            border: none;
            box-shadow: none;
        }

        iframe { background: #ffffff; transition: all 0.3s ease; }
        
        #anno-overlay { display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: transparent; z-index: 9999; overflow: auto; transition: background 0.2s ease; }
        #region-mask { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0, 0, 0, 0.2); cursor: crosshair; }
        #region-box { position: absolute; border: 2px dashed #89b4fa; background: rgba(137, 180, 250, 0.25); display: none; pointer-events: none; }

        #anno-container { display: none; width: 100%; height: 100%; min-height: 100vh; position: relative; }
        #fabric-wrapper { box-shadow: 0 0 30px rgba(0,0,0,0.8); background: #fff; }

        #annotation-bar { position: fixed; top: 15px; left: 50%; transform: translateX(-50%); background: #1e1e2e; padding: 8px 16px; border-radius: 10px; box-shadow: 0 8px 25px rgba(0,0,0,0.6); border: 1px solid #45475a; display: flex; gap: 6px; align-items: center; z-index: 10002; flex-wrap: wrap; justify-content: center; }
        #annotation-bar button { padding: 6px 10px; font-size: 12px; background: #313244; color: #cdd6f4; border: 1px solid #45475a; }
        #annotation-bar button:hover { background: #45475a; color: #ffffff; }
        #annotation-bar button.active { background: #89b4fa; color: #11111b; border-color: #89b4fa; font-weight: bold; }
        
        #gif-modal { display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.85); z-index: 10010; justify-content: center; align-items: center; flex-direction: column; gap: 15px; }
        #gif-modal img { max-width: 80vw; max-height: 70vh; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.8); object-fit: contain; }

        #toast { display: none; position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #313244; color: #a6e3a1; padding: 10px 20px; border-radius: 8px; font-size: 13px; font-weight: bold; border: 1px solid #45475a; box-shadow: 0 10px 25px rgba(0,0,0,0.5); z-index: 10003; }
    </style>
</head>
<body>
    <header>
        <div class="logo">⚡ H5 原型与交互设计实验室</div>
        <div class="btn-group">
            <button class="purple" id="ai-toggle-btn" onclick="toggleAiDrawer()">🤖 AI 代码助手</button>
            <button class="danger" onclick="clearCode()">清空代码</button>
            <button class="primary" onclick="downloadH5()">导出 HTML</button>
        </div>
    </header>

    <div class="container">
        <!-- 1. 代码编辑区 -->
        <div class="editor-area" id="editor-area">
            <div class="area-title">代码编辑区 (原生 HTML/CSS/JS)</div>
            <textarea id="code-input" placeholder="输入代码..." oninput="renderCode()"></textarea>
        </div>

        <!-- 编辑区与预览区之间的左右拖拽条 -->
        <div class="resizer" id="editor-resizer" title="按住左右拖拽调整编辑器宽度"></div>

        <!-- 2. 实时原型预览区 -->
        <div class="preview-area" id="preview-area">
            <div class="area-title">
                <span>实时原型预览</span>
                <div class="btn-group">
                    <button onclick="switchDevice('desktop')" style="padding: 2px 8px; font-size: 11px;">💻 桌面视图</button>
                    <button onclick="switchDevice('mobile')" style="padding: 2px 8px; font-size: 11px;">📱 手机视图</button>
                    <button id="fullscreen-btn" onclick="toggleAppFullscreen()" style="padding: 2px 8px; font-size: 11px;">🖥️ 界面全屏</button>
                </div>
            </div>
            <div class="iframe-wrapper desktop-mode" id="iframe-wrapper">
                <iframe id="preview-frame"></iframe>
            </div>
            <div class="area-title" style="border-top: 1px solid #313244;">
                <span>演示与导出工具栏</span>
                <div class="btn-group">
                    <button class="primary" onclick="startVectorCrop()">✂️ 区域标注截图</button>
                    <button class="purple" onclick="startFullCrop()">📸 视图截图</button>
                    <button class="success" onclick="startScrollCrop()">📜 滚动长截图</button>

                    <button id="video-record-btn" class="purple" onclick="toggleVideoRecord()">🎥 录制 MP4 视频</button>

                    <div style="display: flex; align-items: center; gap: 4px; background: #2a2b3d; padding: 2px 6px; border-radius: 6px; border: 1px solid #45475a;">
                        <span style="font-size: 11px; color: #a6adc8;">⏱️</span>
                        <select id="gif-duration-select" style="padding: 2px 4px; font-size: 12px; border: none; background: transparent;">
                            <option value="3">3 秒</option>
                            <option value="5" selected>5 秒 (推荐)</option>
                            <option value="8">8 秒</option>
                            <option value="10">10 秒</option>
                        </select>
                    </div>
                    <button id="gif-record-btn" style="background: #e11d48; color: #fff; border:none;" onclick="recordGif()">🎬 录制 GIF</button>
                </div>
            </div>
        </div>

        <!-- 预览区与 AI 面板之间的左右拖拽条 -->
        <div class="resizer" id="ai-resizer" style="display: none;" title="按住左右拖拽调整 AI 面板宽度"></div>

        <!-- 3. AI 代码助手区 -->
        <div class="ai-area" id="ai-area">
            <div class="area-title">
                <div style="display: flex; align-items: center; gap: 6px;">
                    <span>🤖</span>
                    <select id="ai-provider-select" onchange="changeAiProvider()" style="font-size: 11px; padding: 2px 6px;">
                        <option value="https://chat.deepseek.com">DeepSeek Chat</option>
                        <option value="https://gemini.google.com">Google Gemini</option>
                        <option value="https://chatgpt.com">ChatGPT</option>
                        <option value="https://kimi.moonshot.cn">Kimi 智能助手</option>
                    </select>
                </div>
                <div class="btn-group">
                    <button onclick="openAiInExternalWindow()" style="padding: 2px 6px; font-size: 11px;" title="在新窗口独立打开">🗖 独立打开</button>
                    <button onclick="toggleAiDrawer()" style="padding: 2px 6px; font-size: 11px; color: #ef4444;">✕ 关闭</button>
                </div>
            </div>
            <div class="ai-iframe-container" id="ai-iframe-wrapper">
            </div>
        </div>
    </div>

    <div id="gif-modal">
        <h3 style="color: #a6e3a1;">🎉 GIF 动图录制成功！</h3>
        <img id="gif-result" src="" alt="录制的GIF动图">
        <div class="btn-group">
            <button class="primary" onclick="downloadGif()">💾 保存 GIF 到本地</button>
            <button class="danger" onclick="closeGifModal()">关闭</button>
        </div>
    </div>

    <div id="anno-overlay">
        <div id="region-mask"><div id="region-box"></div></div>

        <div id="anno-container">
            <div id="annotation-bar">
                <input type="color" id="stroke-color" value="#ff4757" onchange="updateStrokeSettings()">
                <div style="width:1px; height:18px; background:#45475a;"></div>
                <button id="tool-select" onclick="setTool('select')">🖐️ 选择</button>
                <button id="tool-arrow" onclick="setTool('arrow')">↘ 锥形箭头</button>
                <button id="tool-polyline" onclick="setTool('polyline')">⚡ 折线</button>
                <button id="tool-polyline-arrow" onclick="setTool('polyline-arrow')">⚡ 箭头折线</button>
                <button id="tool-rect" onclick="setTool('rect')">矩形</button>
                <button id="tool-circle" onclick="setTool('circle')">圆形</button>
                <button id="tool-number" onclick="setTool('number')">① 图章</button>
                <button id="tool-text" onclick="setTool('text')">T 文字</button>
                <button id="tool-magnifier" onclick="setTool('magnifier')">🔍 放大镜</button>
                <button id="tool-spotlight" onclick="setTool('spotlight')">💡 聚光灯</button>

                <div style="width:1px; height:18px; background:#45475a;"></div>
                <button onclick="deleteActiveObject()" class="danger">删除</button>
                <button class="success" onclick="copyToClipboard()">📋 复制</button>
                <button class="primary" onclick="confirmCrop()">💾 保存</button>
                <button onclick="cancelCrop()">取消</button>
            </div>
            <div id="fabric-wrapper">
                <canvas id="anno-canvas"></canvas>
            </div>
        </div>
    </div>

    <div id="toast"></div>

    <script>
        const input = document.getElementById('code-input');
        const iframe = document.getElementById('preview-frame');
        
        input.value = `<!DOCTYPE html><html><head><meta charset="utf-8"><title>原型测试</title><style>
body { margin: 0; font-family: -apple-system, sans-serif; background: #f1f5f9; padding: 20px; display: flex; flex-direction: column; align-items: center; -webkit-font-smoothing: antialiased; }
.card { width: 100%; max-width: 360px; background: white; padding: 20px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.08); text-align: center; margin-bottom: 20px; }
.btn { background: #3b82f6; color: white; border: none; padding: 12px 24px; border-radius: 10px; font-weight: bold; cursor: pointer; transition: transform 0.2s, background 0.2s; width: 100%; margin-top: 15px; }
.btn:hover { background: #2563eb; transform: scale(1.03); }
.btn:active { transform: scale(0.97); }
.badge { display: inline-block; background: #e0f2fe; color: #0284c7; padding: 4px 12px; border-radius: 20px; font-size: 12px; font-weight: bold; margin-bottom: 10px; }
select { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #cbd5e1; font-size: 14px; margin-top: 10px; }
</style></head><body>
<div class="card">
    <span class="badge">原型测试</span>
    <h2>AI 联动原型开发测试</h2>
    <p style="color: #64748b; font-size: 14px; margin-top: 8px;">点击右上角【🤖 AI 代码助手】，边问 DeepSeek 边改页面！</p>
    <select>
        <option>请选择适用渠道...</option>
        <option>翼支付（原生收银台）</option>
        <option>微信支付（H5收银台）</option>
        <option>支付宝（小程序收银台）</option>
    </select>
    <button class="btn" onclick="alert('触发原型点击事件！')">点击测试交互</button>
</div>
</body></html>`;
        
        renderCode();
        function renderCode() { 
            try {
                const doc = iframe.contentDocument || iframe.contentWindow.document; 
                doc.open(); doc.write(input.value); doc.close(); 
            } catch(e) { console.error("渲染失败", e); }
        }

        let isAiOpen = false;

        function toggleAiDrawer() {
            const aiArea = document.getElementById('ai-area');
            const toggleBtn = document.getElementById('ai-toggle-btn');
            const aiResizer = document.getElementById('ai-resizer');
            if (!aiArea || !toggleBtn) return;

            isAiOpen = !isAiOpen;
            if (isAiOpen) {
                aiArea.classList.add('active');
                if (aiResizer) aiResizer.style.display = 'block';
                toggleBtn.style.background = '#059669';
                changeAiProvider(); 
            } else {
                aiArea.classList.remove('active');
                if (aiResizer) aiResizer.style.display = 'none';
                toggleBtn.style.background = '#8b5cf6';
            }
        }

        function changeAiProvider() {
            const providerSelect = document.getElementById('ai-provider-select');
            const container = document.getElementById('ai-iframe-wrapper');
            if (!providerSelect || !container) return;

            const url = providerSelect.value;
            const providerName = providerSelect.options[providerSelect.selectedIndex].text;
            container.innerHTML = '';

            const isElectron = !!(window.process && window.process.versions && window.process.versions.electron) || 
                               navigator.userAgent.toLowerCase().includes('electron');

            const fakeChromeUA = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36";

            if (isElectron) {
                const webview = document.createElement('webview');
                webview.id = 'ai-webview';
                webview.src = url;
                webview.style.width = '100%';
                webview.style.height = '100%';
                webview.setAttribute('useragent', fakeChromeUA);
                webview.setAttribute('allowpopups', 'true');
                webview.setAttribute('webpreferences', 'allowRunningInsecureContent=true, javascript=true');
                container.appendChild(webview);
            } else {
                const iframe = document.createElement('iframe');
                iframe.src = url;
                iframe.style.width = '100%';
                iframe.style.height = '100%';
                iframe.setAttribute('allow', 'microphone; camera; clipboard-write');

                if (url.includes('deepseek.com') || url.includes('gemini.google.com') || url.includes('chatgpt.com')) {
                    const fallbackNotice = document.createElement('div');
                    fallbackNotice.style.cssText = `
                        position: absolute; top: 0; left: 0; width: 100%; height: 100%;
                        background: #181825; color: #cdd6f4; display: flex; flex-direction: column;
                        justify-content: center; align-items: center; padding: 24px; text-align: center;
                        z-index: 2;
                    `;
                    fallbackNotice.innerHTML = `
                        <div style="font-size: 36px; margin-bottom: 12px;">🛡️</div>
                        <h3 style="margin-bottom: 8px; color: #f38ba8; font-size: 15px;">浏览器安全拦截提示</h3>
                        <p style="font-size: 12px; color: #a6adc8; margin-bottom: 20px; line-height: 1.6; max-width: 300px;">
                            <strong style="color: #89b4fa;">${providerName}</strong> 官方启用了 <code style="background:#313244; padding:2px 4px; border-radius:4px;">X-Frame-Options</code> 防内嵌保护，网页版浏览器禁止框架嵌套。
                        </p>
                        <button onclick="window.open('${url}', '_blank')" class="primary" style="padding: 10px 18px; font-size: 13px; background: #3b82f6; color: #fff; border: none; border-radius: 6px; cursor: pointer; font-weight: bold;">
                            🚀 在新窗口打开 ${providerName}
                        </button>
                    `;
                    container.appendChild(fallbackNotice);
                } else {
                    container.appendChild(iframe);
                }
            }
        }

        function openAiInExternalWindow() {
            const providerSelect = document.getElementById('ai-provider-select');
            if (providerSelect) window.open(providerSelect.value, '_blank');
        }

        /* 初始化拖拽缩放逻辑（包含：代码区缩放 & AI面板缩放） */
        document.addEventListener('DOMContentLoaded', () => {
            const previewFrame = document.getElementById('preview-frame');
            const aiContainer = document.getElementById('ai-iframe-wrapper');

            // 1. 代码编辑器 vs 实时预览 拖拽控制
            const editorResizer = document.getElementById('editor-resizer');
            const editorArea = document.getElementById('editor-area');

            let isEditorResizing = false;
            let editorStartX = 0;
            let editorStartWidth = 0;

            if (editorResizer && editorArea) {
                editorResizer.addEventListener('mousedown', (e) => {
                    isEditorResizing = true;
                    editorStartX = e.clientX;
                    editorStartWidth = editorArea.getBoundingClientRect().width;

                    editorResizer.classList.add('dragging');
                    document.body.style.cursor = 'col-resize';
                    document.body.style.userSelect = 'none';

                    // 拖拽时屏蔽 iframe 鼠标响应，防止拖拽断连
                    if (previewFrame) previewFrame.classList.add('no-pointer-events');
                    if (aiContainer) aiContainer.classList.add('no-pointer-events');
                });

                document.addEventListener('mousemove', (e) => {
                    if (!isEditorResizing) return;
                    const dx = e.clientX - editorStartX;
                    let newWidth = editorStartWidth + dx;

                    const minWidth = 200;
                    const maxWidth = window.innerWidth * 0.7;

                    if (newWidth < minWidth) newWidth = minWidth;
                    if (newWidth > maxWidth) newWidth = maxWidth;

                    editorArea.style.width = `${newWidth}px`;
                });

                document.addEventListener('mouseup', () => {
                    if (isEditorResizing) {
                        isEditorResizing = false;
                        editorResizer.classList.remove('dragging');
                        document.body.style.cursor = '';
                        document.body.style.userSelect = '';

                        if (previewFrame) previewFrame.classList.remove('no-pointer-events');
                        if (aiContainer) aiContainer.classList.remove('no-pointer-events');
                    }
                });
            }

            // 2. 实时预览 vs AI 面板 拖拽控制
            const aiResizer = document.getElementById('ai-resizer');
            const aiArea = document.getElementById('ai-area');

            let isAiResizing = false;
            let aiStartX = 0;
            let aiStartWidth = 0;

            if (aiResizer && aiArea) {
                aiResizer.addEventListener('mousedown', (e) => {
                    isAiResizing = true;
                    aiStartX = e.clientX;
                    aiStartWidth = aiArea.getBoundingClientRect().width;

                    aiResizer.classList.add('dragging');
                    document.body.style.cursor = 'col-resize';
                    document.body.style.userSelect = 'none';

                    if (previewFrame) previewFrame.classList.add('no-pointer-events');
                    if (aiContainer) aiContainer.classList.add('no-pointer-events');
                });

                document.addEventListener('mousemove', (e) => {
                    if (!isAiResizing) return;
                    const dx = aiStartX - e.clientX;
                    let newWidth = aiStartWidth + dx;

                    const minWidth = 320;
                    const maxWidth = window.innerWidth * 0.7;

                    if (newWidth < minWidth) newWidth = minWidth;
                    if (newWidth > maxWidth) newWidth = maxWidth;

                    aiArea.style.width = `${newWidth}px`;
                });

                document.addEventListener('mouseup', () => {
                    if (isAiResizing) {
                        isAiResizing = false;
                        aiResizer.classList.remove('dragging');
                        document.body.style.cursor = '';
                        document.body.style.userSelect = '';

                        if (previewFrame) previewFrame.classList.remove('no-pointer-events');
                        if (aiContainer) aiContainer.classList.remove('no-pointer-events');
                    }
                });
            }
        });

        const annoOverlay = document.getElementById('anno-overlay');
        const regionMask = document.getElementById('region-mask');
        const regionBox = document.getElementById('region-box');
        const annoContainer = document.getElementById('anno-container');
        
        let fabricCanvas = null;
        let startX = 0, startY = 0;
        let regionRect = { left: 0, top: 0, width: 0, height: 0 };
        let currentTool = 'select';
        let strokeColor = '#ff4757';
        let isDrawingShape = false;
        let tempDrawingObj = null;
        let numberedCount = 1;
        let recordedGifUrl = '';
        let currentHdScale = 2.5;

        let globalSpotlightMask = null;
        let polylinePoints = [];
        let polylinePreviewLine = null;
        let polylineTempMarkers = [];

        let mediaRecorder = null;
        let recordedChunks = [];

        function switchDevice(mode) {
            const wrapper = document.getElementById('iframe-wrapper');
            if (mode === 'mobile') {
                wrapper.className = 'iframe-wrapper mobile-mode';
                showToast('已切换至 📱 手机视图');
            } else {
                wrapper.className = 'iframe-wrapper desktop-mode';
                showToast('已切换至 💻 桌面视图');
            }
        }

        function getHtml2CanvasOptions(extraOpts = {}) {
            return {
                useCORS: true,
                allowTaint: true,
                backgroundColor: null,
                logging: false,
                onclone: (clonedDoc) => {
                    const allElements = clonedDoc.querySelectorAll('*');
                    allElements.forEach(el => {
                        const style = window.getComputedStyle(el);
                        
                        if (style.opacity === '0' || style.visibility === 'hidden') {
                            el.style.setProperty('display', 'none', 'important');
                        }
                        
                        if (style.backdropFilter && style.backdropFilter !== 'none') {
                            el.style.backdropFilter = 'none';
                            el.style.webkitBackdropFilter = 'none';
                        }
                        if (style.webkitBackdropFilter && style.webkitBackdropFilter !== 'none') {
                            el.style.webkitBackdropFilter = 'none';
                        }

                        if (style.mixBlendMode && style.mixBlendMode !== 'normal') {
                            el.style.mixBlendMode = 'normal';
                        }
                        if (style.filter && style.filter.includes('blur')) {
                            el.style.filter = style.filter.replace(/blur\([^)]+\)/g, '');
                        }
                    });
                },
                ...extraOpts
            };
        }

        async function toggleVideoRecord() {
            const btn = document.getElementById('video-record-btn');
            if (mediaRecorder && mediaRecorder.state === 'recording') {
                mediaRecorder.stop();
                return;
            }

            try {
                showToast('请在弹窗中选择“当前标签页”开启 MP4 录屏');
                const stream = await navigator.mediaDevices.getDisplayMedia({
                    video: { displaySurface: "browser", frameRate: 30 },
                    audio: false
                });

                recordedChunks = [];
                const mimeTypes = ['video/mp4;codecs=avc1.42E01E,mp4a.40.2', 'video/mp4;codecs=avc1', 'video/mp4', 'video/webm;codecs=vp9', 'video/webm'];
                let selectedMime = mimeTypes.find(type => MediaRecorder.isTypeSupported(type)) || '';

                mediaRecorder = selectedMime ? new MediaRecorder(stream, { mimeType: selectedMime }) : new MediaRecorder(stream);
                mediaRecorder.ondataavailable = (e) => { if (e.data.size > 0) recordedChunks.push(e.data); };
                mediaRecorder.onstop = () => {
                    clearInterval(videoRecordTimer);
                    btn.innerText = '🎥 录制 MP4 视频';
                    btn.className = 'purple';
                    const blob = new Blob(recordedChunks, { type: selectedMime || 'video/mp4' });
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = `H5原型演示录屏_${Date.now()}.mp4`;
                    a.click();
                    showToast('🎉 录屏已成功保存为 MP4 视频！');
                };

                stream.getVideoTracks()[0].onended = () => {
                    if (mediaRecorder && mediaRecorder.state === 'recording') mediaRecorder.stop();
                };

                mediaRecorder.start(100);
                videoRecordSeconds = 0;
                btn.innerText = '🔴 停止录制 (0s)';
                btn.className = 'danger';
                videoRecordTimer = setInterval(() => {
                    videoRecordSeconds++;
                    btn.innerText = `🔴 停止录制 (${videoRecordSeconds}s)`;
                }, 1000);
                showToast('🎥 MP4 录屏已开始！再次点击按钮即可保存');
            } catch (err) {
                if (err.name !== 'NotAllowedError') alert('发起录屏失败：' + err.message);
            }
        }

/* ---------------- 修复后的 GIF 录制逻辑 ---------------- */
async function recordGif() {
    if (!checkDependencies()) return;
    const durationSelect = document.getElementById('gif-duration-select');
    const recordBtn = document.getElementById('gif-record-btn');
    const seconds = parseInt(durationSelect ? durationSelect.value : 5, 10);

    recordBtn.disabled = true;
    recordBtn.innerText = '⏳ 准备采样...';

    const doc = iframe.contentDocument || iframe.contentWindow.document;
    if (!doc || !doc.body) {
        alert('预览页面内容为空，无法生成 GIF');
        recordBtn.disabled = false;
        recordBtn.innerText = '🎬 录制 GIF';
        return;
    }

    // 获取 iframe 实际显示的宽高
    const width = iframe.clientWidth || 375;
    const height = iframe.clientHeight || 667;

    showToast(`🎬 开始录制 GIF (${seconds} 秒)！`);
    const frames = [];
    let count = 0;
    const fps = 10;
    const intervalTime = 1000 / fps;
    const maxFrames = seconds * fps;

    const timer = setInterval(async () => {
        try {
            // scale 明确设为 1，确保采样 Canvas 的分辨率与实际宽高 1:1 严格一致
            // 彻底解决 gifshot 居中裁切导致的“画面只留中间一小块”Bug
            const canvas = await html2canvas(doc.body, { 
                useCORS: true, 
                allowTaint: true, 
                scale: 1, 
                width: width, 
                height: height, 
                logging: false 
            });

            frames.push(canvas.toDataURL('image/png'));
            count++;
            recordBtn.innerText = `🎬 采样中 (${count}/${maxFrames})`;

            if (count >= maxFrames) {
                clearInterval(timer);
                processGifSynthesis(frames, width, height, recordBtn);
            }
        } catch(e) {
            console.error('GIF 采样失败', e);
            clearInterval(timer);
            recordBtn.disabled = false;
            recordBtn.innerText = '🎬 录制 GIF';
            showToast('录制失败：' + e.message);
        }
    }, intervalTime);
}

function processGifSynthesis(frames, width, height, recordBtn) {
    if (typeof gifshot === 'undefined') {
        alert('GIF 库 (gifshot) 未成功加载，请刷新页面重试');
        recordBtn.disabled = false;
        recordBtn.innerText = '🎬 录制 GIF';
        return;
    }

    recordBtn.innerText = '⚙️ 合成 GIF 中...';
    showToast('⏳ 正在生成 GIF 动图，请稍候...');

    gifshot.createGIF({ 
        images: frames, 
        gifWidth: width, 
        gifHeight: height, 
        interval: 0.1, 
        numWorkers: 2 
    }, function(obj) {
        recordBtn.disabled = false; 
        recordBtn.innerText = '🎬 录制 GIF';
        if (!obj.error) {
            recordedGifUrl = obj.image;
            document.getElementById('gif-result').src = recordedGifUrl;
            document.getElementById('gif-modal').style.display = 'flex';
            showToast('🎉 GIF 生成成功！');
        } else { 
            alert('GIF 生成失败：' + obj.error); 
        }
    });
}
        function downloadGif() {
            if (!recordedGifUrl) return;
            const a = document.createElement('a'); a.href = recordedGifUrl;
            a.download = `H5原型动图_${Date.now()}.gif`; a.click();
        }
        function closeGifModal() { document.getElementById('gif-modal').style.display = 'none'; }

        function toggleAppFullscreen() {
            const previewArea = document.getElementById('preview-area');
            const btn = document.getElementById('fullscreen-btn');
            previewArea.classList.toggle('app-fullscreen');
            btn.innerHTML = previewArea.classList.contains('app-fullscreen') ? '↩️ 还原双栏' : '🖥️ 界面全屏';
        }

        function getHDScale() {
            const dpr = window.devicePixelRatio || 1;
            return Math.max(dpr * 2, 2.5);
        }

        async function startScrollCrop() {
            if (!checkDependencies()) return;
            try {
                showToast('正在捕获整页长图...');
                const doc = iframe.contentDocument || iframe.contentWindow.document;
                const win = iframe.contentWindow;
                if (!doc || !doc.body) throw new Error('页面尚未加载完全');
                if (doc.fonts) await doc.fonts.ready;

                const origScrollX = win.scrollX || doc.documentElement.scrollLeft || doc.body.scrollLeft || 0;
                const origScrollY = win.scrollY || doc.documentElement.scrollTop || doc.body.scrollTop || 0;

                win.scrollTo(0, 0);
                await new Promise(r => setTimeout(r, 150));

                const origHeight = iframe.style.height;
                const scrollHeight = Math.max(doc.body.scrollHeight, doc.documentElement.scrollHeight);
                const clientWidth = iframe.clientWidth;
                iframe.style.height = scrollHeight + 'px';

                const hdScale = getHDScale();
                const capturedCanvas = await html2canvas(doc.body, getHtml2CanvasOptions({ 
                    scale: hdScale,
                    width: clientWidth, 
                    height: scrollHeight,
                    scrollX: 0,
                    scrollY: 0,
                    windowWidth: clientWidth, 
                    windowHeight: scrollHeight
                }));

                iframe.style.height = origHeight;
                win.scrollTo(origScrollX, origScrollY);

                regionRect = { left: 0, top: 0, width: clientWidth, height: scrollHeight };

                annoOverlay.style.display = 'block';
                regionMask.style.display = 'none';
                enterFabricMode(capturedCanvas, true, hdScale);
            } catch (err) { 
                alert('滚动截图失败：' + err.message); 
                iframe.style.height = '100%'; 
            }
        }

        async function startFullCrop() {
            if (!checkDependencies()) return;
            try {
                showToast('正在捕获当前视图截图...');
                const doc = iframe.contentDocument || iframe.contentWindow.document;
                const win = iframe.contentWindow;
                if (!doc || !doc.body) throw new Error('页面尚未加载完全');
                if (doc.fonts) await doc.fonts.ready;

                const clientWidth = iframe.clientWidth;
                const clientHeight = iframe.clientHeight;
                const scrollX = win.scrollX || doc.documentElement.scrollLeft || doc.body.scrollLeft || 0;
                const scrollY = win.scrollY || doc.documentElement.scrollTop || doc.body.scrollTop || 0;
                const hdScale = getHDScale();

                const fullCanvas = await html2canvas(doc.body, getHtml2CanvasOptions({ 
                    scale: hdScale
                }));

                const viewCanvas = document.createElement('canvas');
                viewCanvas.width = clientWidth * hdScale;
                viewCanvas.height = clientHeight * hdScale;
                const ctx = viewCanvas.getContext('2d');

                const cropX = scrollX * hdScale;
                const cropY = scrollY * hdScale;
                const cropW = Math.min(fullCanvas.width - cropX, clientWidth * hdScale);
                const cropH = Math.min(fullCanvas.height - cropY, clientHeight * hdScale);

                ctx.drawImage(fullCanvas, cropX, cropY, cropW, cropH, 0, 0, cropW, cropH);

                regionRect = { left: 0, top: 0, width: clientWidth, height: clientHeight };
                annoOverlay.style.display = 'block';
                regionMask.style.display = 'none';
                enterFabricMode(viewCanvas, true, hdScale);
            } catch (err) { alert('截图失败：' + err.message); }
        }

        async function startVectorCrop() {
            if (!checkDependencies()) return;
            try {
                const doc = iframe.contentDocument || iframe.contentWindow.document;
                if (!doc || !doc.body) throw new Error('页面尚未加载完全');
                if (doc.fonts) await doc.fonts.ready;

                showToast('请用鼠标拖拽框选截图区域');
                const hdScale = getHDScale();

                const capturedCanvas = await html2canvas(doc.body, getHtml2CanvasOptions({ 
                    scale: hdScale
                }));

                annoOverlay.style.background = 'transparent';
                annoOverlay.style.display = 'block';
                regionMask.style.display = 'block';
                annoContainer.style.display = 'none';
                regionBox.style.display = 'none';

                regionMask.onmousedown = (e) => {
                    startX = e.clientX; startY = e.clientY;
                    regionBox.style.display = 'block';
                    regionMask.onmousemove = (e) => {
                        const curX = e.clientX, curY = e.clientY;
                        regionRect.left = Math.min(startX, curX); regionRect.top = Math.min(startY, curY);
                        regionRect.width = Math.abs(curX - startX); regionRect.height = Math.abs(curY - startY);
                        Object.assign(regionBox.style, { left: regionRect.left + 'px', top: regionRect.top + 'px', width: regionRect.width + 'px', height: regionRect.height + 'px' });
                    };
                    regionMask.onmouseup = () => {
                        regionMask.onmousemove = null;
                        regionMask.onmouseup = null;
                        if (regionRect.width > 10 && regionRect.height > 10) {
                            enterFabricMode(capturedCanvas, false, hdScale);
                        } else {
                            cancelCrop();
                        }
                    };
                };
            } catch (err) { alert('截图初始化失败：' + err.message); }
        }

        function enterFabricMode(capturedCanvas, isFullPage = false, scale = 2.5) {
            currentHdScale = scale;
            annoOverlay.style.background = 'rgba(0,0,0,0.75)';
            annoContainer.style.display = 'block';

            let cropCanvas;
            if (isFullPage) {
                cropCanvas = capturedCanvas;
            } else {
                cropCanvas = document.createElement('canvas');
                const iframeBounds = iframe.getBoundingClientRect();
                const win = iframe.contentWindow;
                const doc = iframe.contentDocument || win.document;

                const scrollX = win.scrollX || doc.documentElement.scrollLeft || doc.body.scrollLeft || 0;
                const scrollY = win.scrollY || doc.documentElement.scrollTop || doc.body.scrollTop || 0;

                const contentX = (regionRect.left - iframeBounds.left) + scrollX;
                const contentY = (regionRect.top - iframeBounds.top) + scrollY;

                const cropX = Math.max(0, contentX * scale);
                const cropY = Math.max(0, contentY * scale);
                const cropW = Math.min(capturedCanvas.width - cropX, regionRect.width * scale);
                const cropH = Math.min(capturedCanvas.height - cropY, regionRect.height * scale);

                if (cropW <= 0 || cropH <= 0) {
                    alert('选区偏离有效画面，请重新框选');
                    cancelCrop();
                    return;
                }

                cropCanvas.width = cropW; 
                cropCanvas.height = cropH;
                const cropCtx = cropCanvas.getContext('2d');
                cropCtx.drawImage(capturedCanvas, cropX, cropY, cropW, cropH, 0, 0, cropW, cropH);
            }

            const wrapper = document.getElementById('fabric-wrapper');
            if (isFullPage) {
                wrapper.style.position = 'relative'; wrapper.style.margin = '70px auto 40px auto';
                wrapper.style.left = '0'; wrapper.style.top = '0';
            } else {
                wrapper.style.position = 'absolute'; wrapper.style.margin = '0';
                wrapper.style.left = regionRect.left + 'px'; wrapper.style.top = regionRect.top + 'px';
            }
            wrapper.style.width = regionRect.width + 'px'; wrapper.style.height = regionRect.height + 'px';

            if (fabricCanvas) { fabricCanvas.dispose(); }

            fabricCanvas = new fabric.Canvas('anno-canvas', {
                width: regionRect.width,
                height: regionRect.height,
                selection: true
            });

            fabricCanvas.skipTargetFind = (currentTool !== 'select');

            fabric.Image.fromURL(cropCanvas.toDataURL(), (img) => {
                img.set({
                    scaleX: regionRect.width / cropCanvas.width,
                    scaleY: regionRect.height / cropCanvas.height
                });
                fabricCanvas.setBackgroundImage(img, fabricCanvas.renderAll.bind(fabricCanvas));
            });

            fabric.Object.prototype.set({
                transparentCorners: false, cornerColor: '#89b4fa',
                cornerStrokeColor: '#1e1e2e', cornerSize: 8, borderColor: '#89b4fa'
            });

            globalSpotlightMask = null;
            numberedCount = 1;
            resetPolylineState();
            setTool('arrow');
            initFabricEvents();
        }

        function initFabricEvents() {
            fabricCanvas.on('mouse:down', (options) => {
                const ptr = fabricCanvas.getPointer(options.e);

                if (currentTool === 'polyline' || currentTool === 'polyline-arrow') {
                    handlePolylineClick(ptr);
                    return;
                }

                if (currentTool === 'select') return;

                isDrawingShape = true;
                startX = ptr.x; startY = ptr.y;
                tempDrawingObj = null;

                if (currentTool === 'text') { isDrawingShape = false; addFabricText(ptr); }
                else if (currentTool === 'number') { isDrawingShape = false; drawNumberedCircle(ptr); }
                else if (currentTool === 'magnifier') { isDrawingShape = false; addMagnifier(ptr); }
                else if (currentTool === 'spotlight') { isDrawingShape = false; addSpotlight(ptr); }
                else if (currentTool === 'rect') {
                    tempDrawingObj = new fabric.Rect({ left: startX, top: startY, width: 0, height: 0, stroke: strokeColor, fill: 'transparent', strokeWidth: 3, selectable: false });
                    fabricCanvas.add(tempDrawingObj);
                } else if (currentTool === 'circle') {
                    tempDrawingObj = new fabric.Ellipse({ left: startX, top: startY, rx: 0, ry: 0, stroke: strokeColor, fill: 'transparent', strokeWidth: 3, selectable: false });
                    fabricCanvas.add(tempDrawingObj);
                }
            });

            fabricCanvas.on('mouse:move', (options) => {
                const ptr = fabricCanvas.getPointer(options.e);

                if (currentTool === 'polyline' || currentTool === 'polyline-arrow') {
                    handlePolylineMouseMove(ptr);
                    return;
                }

                if (!isDrawingShape) return;
                const curX = ptr.x, curY = ptr.y;

                if (currentTool === 'rect' && tempDrawingObj) {
                    tempDrawingObj.set({ left: Math.min(startX, curX), top: Math.min(startY, curY), width: Math.abs(curX - startX), height: Math.abs(curY - startY) });
                } else if (currentTool === 'circle' && tempDrawingObj) {
                    tempDrawingObj.set({ left: Math.min(startX, curX), top: Math.min(startY, curY), rx: Math.abs(curX - startX) / 2, ry: Math.abs(curY - startY) / 2 });
                } else if (currentTool === 'arrow') {
                    if (Math.hypot(curX - startX, curY - startY) > 5) {
                        if (tempDrawingObj) fabricCanvas.remove(tempDrawingObj);
                        tempDrawingObj = createTaperedArrow(startX, startY, curX, curY, strokeColor);
                        if (tempDrawingObj) fabricCanvas.add(tempDrawingObj);
                    }
                }
                fabricCanvas.renderAll();
            });

            fabricCanvas.on('mouse:up', () => {
                if (isDrawingShape && tempDrawingObj) {
                    tempDrawingObj.set({ selectable: true });
                    tempDrawingObj.setCoords();
                    setTool('select');
                }
                isDrawingShape = false;
                tempDrawingObj = null;
            });

            fabricCanvas.on('mouse:dblclick', () => {
                if (currentTool === 'polyline') finishPolyline(false);
                else if (currentTool === 'polyline-arrow') finishPolyline(true);
            });
        }

        function createTaperedArrow(fromX, fromY, toX, toY, color) {
            const dx = toX - fromX, dy = toY - fromY;
            const len = Math.hypot(dx, dy);
            if (len < 5) return null;

            const angle = Math.atan2(dy, dx);
            const headLen = Math.min(26, len * 0.4);
            const headWidth = Math.min(20, len * 0.35);
            const neckWidth = Math.min(8, headWidth * 0.4);
            const shaftLen = len - headLen;

            const pts = [
                { x: 0, y: 0 },
                { x: shaftLen, y: -neckWidth / 2 },
                { x: shaftLen, y: -headWidth / 2 },
                { x: len, y: 0 },
                { x: shaftLen, y: headWidth / 2 },
                { x: shaftLen, y: neckWidth / 2 }
            ];

            const cos = Math.cos(angle), sin = Math.sin(angle);
            const transformedPts = pts.map(p => ({
                x: fromX + p.x * cos - p.y * sin,
                y: fromY + p.x * sin + p.y * cos
            }));

            return new fabric.Polygon(transformedPts, {
                fill: color, stroke: color, strokeWidth: 1, strokeLineJoin: 'round', selectable: false
            });
        }

        function handlePolylineClick(ptr) {
            polylinePoints.push({ x: ptr.x, y: ptr.y });
            const dot = new fabric.Circle({ left: ptr.x - 3, top: ptr.y - 3, radius: 3, fill: strokeColor, selectable: false, evented: false });
            fabricCanvas.add(dot);
            polylineTempMarkers.push(dot);

            if (polylinePoints.length > 1) {
                const prev = polylinePoints[polylinePoints.length - 2];
                const seg = new fabric.Line([prev.x, prev.y, ptr.x, ptr.y], { stroke: strokeColor, strokeWidth: 3, selectable: false, evented: false });
                fabricCanvas.add(seg);
                polylineTempMarkers.push(seg);
            }
        }

        function handlePolylineMouseMove(ptr) {
            if (polylinePoints.length === 0) return;
            const lastPt = polylinePoints[polylinePoints.length - 1];
            if (polylinePreviewLine) fabricCanvas.remove(polylinePreviewLine);
            polylinePreviewLine = new fabric.Line([lastPt.x, lastPt.y, ptr.x, ptr.y], { stroke: strokeColor, strokeWidth: 2, strokeDashArray: [4, 4], selectable: false, evented: false });
            fabricCanvas.add(polylinePreviewLine);
            fabricCanvas.renderAll();
        }

        function finishPolyline(hasArrow = false) {
            if (polylinePoints.length < 2) { resetPolylineState(); return; }

            const cleanPoints = [];
            polylinePoints.forEach(pt => {
                if (cleanPoints.length === 0) {
                    cleanPoints.push(pt);
                } else {
                    const prev = cleanPoints[cleanPoints.length - 1];
                    if (Math.hypot(pt.x - prev.x, pt.y - prev.y) > 2) {
                        cleanPoints.push(pt);
                    }
                }
            });

            if (cleanPoints.length < 2) { resetPolylineState(); return; }

            if (polylinePreviewLine) fabricCanvas.remove(polylinePreviewLine);
            polylineTempMarkers.forEach(item => fabricCanvas.remove(item));

            const poly = new fabric.Polyline(cleanPoints, { stroke: strokeColor, strokeWidth: 3, fill: 'transparent', strokeLineJoin: 'round', strokeLineCap: 'round' });

            if (hasArrow) {
                const pN = cleanPoints[cleanPoints.length - 1];
                const pPrev = cleanPoints[cleanPoints.length - 2];
                const angle = Math.atan2(pN.y - pPrev.y, pN.x - pPrev.x);
                const triangle = new fabric.Triangle({
                    left: pN.x, top: pN.y, angle: (angle * 180 / Math.PI) + 90, width: 14, height: 16, fill: strokeColor, originX: 'center', originY: 'center'
                });
                const group = new fabric.Group([poly, triangle], { selectable: true });
                fabricCanvas.add(group); fabricCanvas.setActiveObject(group);
            } else {
                poly.set({ selectable: true }); fabricCanvas.add(poly); fabricCanvas.setActiveObject(poly);
            }

            resetPolylineState();
            setTool('select');
            fabricCanvas.renderAll();
            showToast(hasArrow ? '⚡ 带箭头折线绘制完成！' : '⚡ 折线绘制完成！');
        }

        function resetPolylineState() {
            if (polylinePreviewLine) fabricCanvas.remove(polylinePreviewLine);
            polylineTempMarkers.forEach(item => fabricCanvas.remove(item));
            polylinePoints = []; polylineTempMarkers = []; polylinePreviewLine = null;
            if (fabricCanvas) fabricCanvas.renderAll();
        }

        function addSpotlight(ptr) {
            if (!fabricCanvas) return;
            const rx = 80, ry = 60;
            const spotlightControl = new fabric.Ellipse({
                left: ptr.x - rx, top: ptr.y - ry, rx: rx, ry: ry, fill: 'transparent', stroke: '#f59e0b', strokeWidth: 2, strokeDashArray: [6, 6], selectable: true, hasControls: true, cornerColor: '#f59e0b', transparentCorners: false, isSpotlightControl: true
            });

            spotlightControl.on('moving', updateGlobalSpotlightMask);
            spotlightControl.on('scaling', updateGlobalSpotlightMask);
            spotlightControl.on('rotating', updateGlobalSpotlightMask);

            fabricCanvas.add(spotlightControl);
            fabricCanvas.setActiveObject(spotlightControl);
            updateGlobalSpotlightMask();
            setTool('select');
            showToast('💡 聚光灯创建成功！');
        }

        function updateGlobalSpotlightMask() {
            if (!fabricCanvas) return;
            if (globalSpotlightMask) { fabricCanvas.remove(globalSpotlightMask); globalSpotlightMask = null; }

            const spotlights = fabricCanvas.getObjects().filter(obj => obj.isSpotlightControl);
            if (spotlights.length === 0) { fabricCanvas.renderAll(); return; }

            const W = fabricCanvas.width, H = fabricCanvas.height;
            let pathStr = `M 0 0 L ${W} 0 L ${W} ${H} L 0 ${H} Z`;

            spotlights.forEach(spot => {
                const center = spot.getCenterPoint();
                const curRx = spot.rx * spot.scaleX, curRy = spot.ry * spot.scaleY;
                const angle = spot.angle || 0;
                const rad = angle * Math.PI / 180;

                const x1 = center.x + curRy * Math.sin(rad), y1 = center.y - curRy * Math.cos(rad);
                const x2 = center.x - curRy * Math.sin(rad), y2 = center.y + curRy * Math.cos(rad);

                pathStr += ` M ${x1} ${y1} A ${curRx} ${curRy} ${angle} 1 0 ${x2} ${y2} A ${curRx} ${curRy} ${angle} 1 0 ${x1} ${y1}`;
            });

            globalSpotlightMask = new fabric.Path(pathStr, {
                fill: 'rgba(0, 0, 0, 0.65)', fillRule: 'evenodd', left: 0, top: 0, selectable: false, evented: false, objectCaching: false
            });

            fabricCanvas.add(globalSpotlightMask);
            globalSpotlightMask.sendToBack();
            if (fabricCanvas.backgroundImage) globalSpotlightMask.bringForward();
            fabricCanvas.renderAll();
        }

        function addMagnifier(ptr) {
            if (!fabricCanvas || !fabricCanvas.backgroundImage || !fabricCanvas.backgroundImage._element) {
                showToast('背景元素加载中，请稍后重试');
                return;
            }
            const zoom = 2, rx = 80, ry = 60;
            const bgImg = fabricCanvas.backgroundImage._element;

            const patternCanvas = document.createElement('canvas');
            patternCanvas.width = fabricCanvas.width * zoom;
            patternCanvas.height = fabricCanvas.height * zoom;
            const pCtx = patternCanvas.getContext('2d');
            pCtx.scale(zoom, zoom);
            pCtx.drawImage(bgImg, 0, 0, fabricCanvas.width, fabricCanvas.height);

            const magEllipse = new fabric.Ellipse({
                left: ptr.x - rx, top: ptr.y - ry, rx: rx, ry: ry, stroke: strokeColor || '#3b82f6', strokeWidth: 4, shadow: new fabric.Shadow({ color: 'rgba(0,0,0,0.5)', blur: 10, offsetX: 0, offsetY: 4 }), selectable: true, hasControls: true
            });

            function updateMagPattern(obj) {
                const center = obj.getCenterPoint();
                const curW = obj.getScaledWidth(), curH = obj.getScaledHeight();
                const pattern = new fabric.Pattern({ source: patternCanvas, repeat: 'no-repeat', offsetX: -center.x * zoom + curW / 2, offsetY: -center.y * zoom + curH / 2 });
                obj.set('fill', pattern);
            }

            updateMagPattern(magEllipse);
            magEllipse.on('moving', function() { updateMagPattern(this); fabricCanvas.renderAll(); });
            magEllipse.on('scaling', function() { updateMagPattern(this); fabricCanvas.renderAll(); });
            magEllipse.on('rotating', function() { updateMagPattern(this); fabricCanvas.renderAll(); });

            fabricCanvas.add(magEllipse);
            fabricCanvas.setActiveObject(magEllipse);
            fabricCanvas.renderAll();
            setTool('select');
            showToast('🔍 放大镜创建成功！');
        }

        function drawNumberedCircle(ptr) {
            const radius = 14;
            const circle = new fabric.Circle({ radius: radius, fill: strokeColor, originX: 'center', originY: 'center' });
            const text = new fabric.Text(String(numberedCount++), { fontSize: 14, fill: '#ffffff', fontWeight: 'bold', originX: 'center', originY: 'center' });
            const group = new fabric.Group([circle, text], { left: ptr.x - radius, top: ptr.y - radius, selectable: true });
            fabricCanvas.add(group); 
            fabricCanvas.renderAll();
        }

        function addFabricText(ptr) {
            const text = new fabric.IText('双击编辑文字', { left: ptr.x, top: ptr.y, fill: strokeColor, fontSize: 18, fontWeight: 'bold' });
            fabricCanvas.add(text); fabricCanvas.setActiveObject(text); fabricCanvas.renderAll();
            setTool('select');
        }

        function setTool(tool) {
            if (currentTool === 'polyline' || currentTool === 'polyline-arrow') resetPolylineState();

            currentTool = tool;
            document.querySelectorAll('#annotation-bar button').forEach(b => b.classList.remove('active'));
            const btn = document.getElementById(`tool-${tool}`);
            if (btn) btn.classList.add('active');

            if (fabricCanvas) {
                fabricCanvas.selection = (tool === 'select');
                fabricCanvas.skipTargetFind = (tool !== 'select');
                if (tool !== 'select') fabricCanvas.discardActiveObject().renderAll();
            }
        }

        window.addEventListener('keydown', (e) => {
            if (annoOverlay.style.display === 'block') {
                if (e.key === 'Escape') {
                    cancelCrop();
                    return;
                }
                if (e.key === 'Delete' || e.key === 'Backspace') {
                    const activeObj = fabricCanvas ? fabricCanvas.getActiveObject() : null;
                    if (activeObj && activeObj.isEditing) return;
                    deleteActiveObject();
                }
                if (e.key === 'Enter') {
                    if (currentTool === 'polyline') finishPolyline(false);
                    else if (currentTool === 'polyline-arrow') finishPolyline(true);
                }
            }
        });

        function updateStrokeSettings() {
            strokeColor = document.getElementById('stroke-color').value;
            if (fabricCanvas) {
                const activeObj = fabricCanvas.getActiveObject();
                if (activeObj) {
                    if (activeObj.type === 'rect' || activeObj.type === 'ellipse' || activeObj.type === 'polygon') {
                        activeObj.set({ stroke: strokeColor, fill: activeObj.type === 'polygon' ? strokeColor : activeObj.fill });
                    } else if (activeObj.type === 'i-text' || activeObj.type === 'text') {
                        activeObj.set({ fill: strokeColor });
                    }
                    fabricCanvas.renderAll();
                }
            }
        }

        function deleteActiveObject() {
            if (!fabricCanvas) return;
            const activeObjs = fabricCanvas.getActiveObjects();
            if (activeObjs.length > 0) {
                activeObjs.forEach(obj => fabricCanvas.remove(obj));
                fabricCanvas.discardActiveObject();
                updateGlobalSpotlightMask();
                fabricCanvas.renderAll();
            }
        }

        async function copyToClipboard() {
            if (!fabricCanvas) return;
            try {
                const dataUrl = fabricCanvas.toDataURL({ 
                    format: 'png', 
                    multiplier: currentHdScale || 2.5
                });
                const res = await fetch(dataUrl);
                const blob = await res.blob();
                await navigator.clipboard.write([ new ClipboardItem({ 'image/png': blob }) ]);
                showToast('📋 已成功复制高保真标注截图到剪贴板！');
            } catch (e) { alert('复制失败：' + e.message); }
        }

        function confirmCrop() {
            if (!fabricCanvas) return;
            const dataUrl = fabricCanvas.toDataURL({ 
                format: 'png', 
                multiplier: currentHdScale || 2.5
            });
            const a = document.createElement('a'); a.href = dataUrl;
            a.download = `H5原型高保真标注截图_${Date.now()}.png`; a.click();
            cancelCrop();
            showToast('💾 高保真截图已成功保存！');
        }

        function cancelCrop() {
            resetPolylineState();
            annoOverlay.style.display = 'none';
            regionMask.style.display = 'none';
            annoContainer.style.display = 'none';
            regionBox.style.display = 'none';
            globalSpotlightMask = null;
            if (fabricCanvas) { fabricCanvas.dispose(); fabricCanvas = null; }
        }

        function clearCode() {
            if (confirm('确定要清空代码吗？')) { input.value = ''; renderCode(); }
        }

        function downloadH5() {
            const blob = new Blob([input.value], { type: 'text/html;charset=utf-8' });
            const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
            a.download = `H5_Prototype_${Date.now()}.html`; a.click();
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.innerText = msg; toast.style.display = 'block';
            setTimeout(() => { toast.style.display = 'none'; }, 2500);
        }

        function checkDependencies() {
            if (typeof html2canvas === 'undefined' || typeof fabric === 'undefined') {
                alert('JS 基础库仍在加载中，请稍等 1-2 秒');
                return false;
            }
            return true;
        }
    </script>
</body>
